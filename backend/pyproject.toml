[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dossier-backend"
version = "0.1.0"
description = "Organisational intelligence platform backend"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "celery==5.6.3",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    "python-multipart==0.0.33",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.6",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
    "cryptography==50.0.2",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov>=6.0",
    "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI dependency injection relies on call-in-default

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
# SQLAlchemy's async bridge switches greenlets; without this, tracing is lost after
# the first awaited database call and coverage reports nonsense.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
