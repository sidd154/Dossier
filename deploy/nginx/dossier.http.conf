# Bootstrap HTTP-only config, used once to obtain Let's Encrypt certificates.
#
#   sudo cp deploy/nginx/dossier.http.conf /etc/nginx/sites-available/dossier.conf
#   sudo ln -sf /etc/nginx/sites-available/dossier.conf /etc/nginx/sites-enabled/dossier.conf
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d app.example.com -d api.example.com --email you@example.com \
#        --agree-tos --no-eff-email
#
# Then replace this file with dossier.conf and reload Nginx.

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Dossier is being configured.\n";
        add_header Content-Type text/plain;
    }
}
